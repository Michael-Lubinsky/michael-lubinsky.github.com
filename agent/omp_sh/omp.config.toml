# omp (Oh My Pi) project config for the arXiv lecture-notes digest.
#
# omp is a superset of pi.dev's harness: same "one capable agent"
# spirit, but with a persistent in-process Python/Bun kernel, native
# LSP/DAP, and a subagent-spawning primitive (used by /review) built
# into the Rust core instead of bolted on via a TypeScript extension.
# For THIS task, the piece that actually matters is the persistent
# Python kernel -- it lets the agent call back into its own `read`
# tool from inside a running Python process, so arXiv fetching,
# filtering, dedup-state I/O, and Markdown generation all happen in
# one live interpreter instead of one-shot bash subprocess calls.

[agent]
system_prompt_file = "SYSTEM.md"
default_model = "claude-sonnet-5"

[tools]
# omp's built-ins: in-process ripgrep/glob/find, `brush` (in-process
# bash with persistent sessions), Python kernel, LSP, DAP, subagent
# spawn/task. LSP and DAP are irrelevant to this task (no code to
# refactor or debug) and are left enabled but unused.
enable = ["read", "write", "edit", "brush", "python", "task"]

[subagents]
# omp's task-delegation tool supports single/parallel/chain patterns
# natively (this is what backs /review). We use "parallel" for the
# two independent research tracks.
[subagents.physics-researcher]
description = "Searches arXiv physics categories for recent lecture-notes-style papers."
prompt_file = "prompts/physics_researcher.md"

[subagents.math-researcher]
description = "Searches arXiv math.* categories for recent lecture-notes-style papers."
prompt_file = "prompts/math_researcher.md"

[approval]
# omp has no built-in "pause for human sign-off" primitive either
# (same tradeoff as pi.dev) -- approval is enforced by instruction in
# SYSTEM.md, not by the harness. Listed here only as a comment so the
# gap is explicit rather than silent.
enforced_by_harness = false
